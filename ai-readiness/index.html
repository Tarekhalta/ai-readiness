<html lang="en">

<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700&display=swap">
<style>
/* Layout: two guided steps on the left (sector, then six areas), a live result card on the right; stacks on phones */
:root{
  --bg:#f3f7f6; --card:#ffffff; --ink:#18302e; --muted:#5e7472; --line:#dbe6e4; --soft:#e7f2f0;
  --accent:#0f7a72; --accent-ink:#ffffff; --sun:#f6c453; --sun-soft:#fdf3d9;
  --lo:#d0644e; --mid:#e3a33b; --hi:#2f9a6a;

}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f1918; --card:#172423; --ink:#e7f1ef; --muted:#9db3b0; --line:#294040; --soft:#1d3331;
  --accent:#4cc3b5; --accent-ink:#0f1918; --sun:#f6c453; --sun-soft:#3a3220; --lo:#ec8a75; --mid:#f0bd5e; --hi:#5ccf96; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1918; --card:#172423; --ink:#e7f1ef; --muted:#9db3b0; --line:#294040; --soft:#1d3331;
  --accent:#4cc3b5; --accent-ink:#0f1918; --sun:#f6c453; --sun-soft:#3a3220; --lo:#ec8a75; --mid:#f0bd5e; --hi:#5ccf96; color-scheme:dark}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.55}
.wrap{max-width:1140px;margin:0 auto;padding-block:28px 72px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
header.top{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap;margin-bottom:28px}
.pill{display:inline-block;background:var(--sun-soft);font-size:13px;font-weight:500;padding:5px 12px;border-radius:999px}
h1{font-size:clamp(30px,4.6vw,46px);line-height:1.12;margin:12px 0 10px;font-weight:700;text-wrap:balance;max-width:18ch}
.lede{color:var(--muted);max-width:56ch;margin:0;font-size:17px}
.lang{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:8px 16px;font-weight:500}
.grid{display:grid;grid-template-columns:minmax(0,1fr) 370px;gap:28px;align-items:start}
@media (max-width:940px){.grid{grid-template-columns:minmax(0,1fr)}}
.step{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:24px;margin-bottom:20px}
.step-head{display:flex;gap:14px;align-items:flex-start;margin-bottom:18px}
.num{flex:none;width:34px;height:34px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-weight:700}
.step h2{font-size:21px;margin:2px 0 2px;font-weight:600}
.hint{color:var(--muted);font-size:14px;margin:0}
.picker{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px}
.pick{display:flex;flex-direction:column;align-items:flex-start;gap:8px;text-align:start;border:1.5px solid var(--line);background:var(--bg);border-radius:14px;padding:14px;font-size:14.5px;font-weight:500;line-height:1.35;position:relative;min-height:88px}
.pick:hover{border-color:var(--accent)}
.pick svg{width:26px;height:26px;stroke:var(--accent);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.pick[aria-pressed="true"]{border-color:var(--accent);background:var(--soft)}
.pick .tick{position:absolute;top:10px;inset-inline-end:10px;width:22px;height:22px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;font-size:13px;color:transparent}
.pick[aria-pressed="true"] .tick{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.progress{display:flex;align-items:center;gap:12px;margin-bottom:18px}
.progress .track{flex:1}
.progress span{font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums;flex:none}
.example{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;background:var(--sun-soft);border-radius:14px;padding:12px 16px;margin-bottom:18px;font-size:14.5px}
.example button{border:none;background:var(--ink);color:var(--bg);border-radius:10px;padding:9px 14px;font-weight:600}
.area{border:1px solid var(--line);border-radius:14px;background:var(--bg);margin-bottom:12px;overflow:hidden}
.area-head{display:flex;align-items:center;gap:12px;padding:14px 16px}
.area-head svg{width:24px;height:24px;stroke:var(--accent);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.area-head h3{margin:0;font-size:17px;font-weight:600;flex:1;min-width:0}
.badge{font-size:13px;font-weight:600;padding:3px 10px;border-radius:999px;background:var(--card);border:1px solid var(--line);font-variant-numeric:tabular-nums;flex:none}
.q{padding:14px 16px;border-top:1px solid var(--line);display:grid;gap:10px;background:var(--card)}
.q p{margin:0;font-size:15.5px}
.seg{display:grid;grid-template-columns:repeat(4,1fr);border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--bg)}
@media (max-width:460px){.seg{grid-template-columns:repeat(2,1fr)}.seg button:nth-child(3){border-inline-start:none}.seg button:nth-child(n+3){border-top:1px solid var(--line)}}
.seg button{border:none;background:transparent;padding:10px 4px;font-size:13.5px;min-width:0}
.seg button+button{border-inline-start:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);font-weight:600}
aside.result{position:sticky;top:calc(env(safe-area-inset-top,0px) + 16px);display:grid;gap:14px}
@media (max-width:940px){aside.result{position:static}}
.hero{background:var(--accent);color:var(--accent-ink);border-radius:var(--r);padding:22px;display:flex;gap:18px;align-items:center}
.ring{width:104px;height:104px;flex:none}
.ring text{fill:var(--accent-ink);font-family:var(--font);font-weight:700}
.hero .k{font-size:13px;opacity:.85}
.hero .lvl{font-size:26px;font-weight:700;line-height:1.15;margin:2px 0 4px}
.hero p{margin:0;font-size:14.5px;line-height:1.45}
.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px;display:grid;gap:12px}
.panel h3{font-size:15px;margin:0;font-weight:600}
.bars{display:grid;gap:10px}
.bar-label{display:flex;justify-content:space-between;font-size:13.5px;gap:8px}
.bar-label span:last-child{font-variant-numeric:tabular-nums;font-weight:600;flex:none}
.track{height:10px;background:var(--soft);border-radius:6px;overflow:hidden}
.fill{height:100%;border-radius:6px;transition:width .35s ease}
.recs{display:grid;gap:10px;margin:0;padding:0;list-style:none}
.recs li{font-size:14.5px;background:var(--bg);border-radius:12px;padding:12px 14px}
.recs b{display:block;font-size:13px;color:var(--muted);font-weight:600;margin-bottom:2px}
.tip{font-size:14px;background:var(--soft);border-radius:12px;padding:12px 14px;margin:0}
.tip b{display:block;font-size:13px;color:var(--accent);margin-bottom:2px}
.copy{border:none;background:var(--ink);color:var(--bg);border-radius:12px;padding:12px;font-weight:600}
.cta{font-size:14px;background:var(--sun-soft);border-radius:14px;padding:14px}
.cta a{color:var(--ink);font-weight:700}
footer{margin-top:36px;color:var(--muted);font-size:13px;max-width:80ch}
@media (prefers-reduced-motion:reduce){.fill{transition:none}}
</style>
</head>
<body>

<div class="wrap">
  <header class="top">
    <div>
      <span class="pill" data-t="pill"></span>
      <h1 data-t="title"></h1>
      <p class="lede" data-t="lede"></p>
    </div>
    <button class="lang" id="langBtn" type="button"></button>
  </header>

  <div class="grid">
    <main>
      <section class="step">
        <div class="step-head"><span class="num">1</span><div><h2 data-t="s1"></h2><p class="hint" data-t="s1h"></p></div></div>
        <div class="picker" id="sectors"></div>
      </section>
      <section class="step">
        <div class="step-head"><span class="num">2</span><div><h2 data-t="s2"></h2><p class="hint" data-t="s2h"></p></div></div>
        <div class="example" id="example"><span data-t="sample"></span><button type="button" id="resetBtn" data-t="reset"></button></div>
        <div class="progress"><div class="track"><div class="fill" id="prog" style="background:var(--accent)"></div></div><span id="counter"></span></div>
        <div id="questions"></div>
      </section>
    </main>

    <aside class="result" aria-live="polite">
      <div class="hero">
        <svg class="ring" viewBox="0 0 108 108" aria-hidden="true">
          <circle cx="54" cy="54" r="46" fill="none" stroke="currentColor" stroke-opacity=".25" stroke-width="10"/>
          <circle id="ringArc" cx="54" cy="54" r="46" fill="none" stroke="var(--sun)" stroke-width="10" stroke-linecap="round" transform="rotate(-90 54 54)" stroke-dasharray="289" stroke-dashoffset="289"/>
          <text id="ringNum" x="54" y="62" text-anchor="middle" font-size="28">0</text>
        </svg>
        <div><div class="k" data-t="scoreK"></div><div class="lvl" id="level"></div><p id="levelSub"></p></div>
      </div>
      <div class="panel">
        <h3 data-t="byArea"></h3>
        <div class="bars" id="bars"></div>
      </div>
      <div class="panel">
        <h3 data-t="priorities"></h3>
        <ul class="recs" id="recs"></ul>
        <p class="tip" id="tip"></p>
        <button class="copy" id="copyBtn" type="button" data-t="copy"></button>
      </div>
      <div class="cta"><span data-t="ctaText"></span> <a href="https://tarekhalteh.com" target="_blank" rel="noopener">tarekhalteh.com</a></div>
    </aside>
  </div>
  <footer data-t="footer"></footer>
</div>

  ["Your documents and data are organized enough for AI to use.","وثائقكم وبياناتكم منظمة بما يكفي ليستفيد منها الذكاء الاصطناعي."]],
  low:["Choose one approved tool for everyone, and test it in Arabic on your own documents before rolling out.","اختاروا أداة معتمدة واحدة للجميع، واختبروها بالعربية على وثائقكم قبل التعميم."],
  mid:["Clean up and centralize key documents (templates, reports, FAQs) so AI tools can work from them.","نظّموا الوثائق الأساسية وجمّعوها (القوالب والتقارير والأسئلة الشائعة) لتعمل عليها أدوات الذكاء الاصطناعي."]},
 {en:"Privacy, ethics & risk",ar:"الخصوصية والأخلاقيات والمخاطر",q:[
  ["There are rules on what personal or sensitive data can go into AI tools.","توجد قواعد حول البيانات الشخصية أو الحساسة التي يجوز إدخالها في أدوات الذكاء الاصطناعي."],
  ["AI vendors are checked for privacy and security.","يتم التحقق من مزوّدي الذكاء الاصطناعي من حيث الخصوصية والأمن."],
  ["Bias and fairness are considered when AI affects people.","يُراعى التحيّز والعدالة عندما يؤثر الذكاء الاصطناعي على الأشخاص."]],
  low:["Issue a one-line rule today: no personal, client or beneficiary data in public AI tools.","أصدروا اليوم قاعدة من سطر واحد: لا بيانات شخصية أو بيانات عملاء أو مستفيدين في أدوات الذكاء الاصطناعي العامة."],
  mid:["Add an AI check to procurement covering where data is stored, whether it trains the model, and bias.","أضيفوا فحصاً للذكاء الاصطناعي في المشتريات يشمل مكان تخزين البيانات واستخدامها في تدريب النموذج والتحيّز."]}
];
const SAMPLE=[2,1,0, 1,1,0, 1,2,0, 1,1,0, 2,1,1, 0,0,0];
let lang="en", sector="biz", answers=SAMPLE.slice(), isSample=true;
try{const l=localStorage.getItem("air-lang"); if(l==="ar"||l==="en") lang=l;}catch(e){}

const $=s=>document.querySelector(s);
const L=()=>lang==="en"?0:1;
const icon=k=>`<svg viewBox="0 0 24 24" aria-hidden="true">${ICONS[k]}</svg>`;
const dimPct=i=>{const a=answers.slice(i*3,i*3+3).filter(v=>v!=null);return a.length?Math.round(a.reduce((s,v)=>s+v,0)/(a.length*3)*100):null};
const color=p=>p==null?"var(--line)":p<50?"var(--lo)":p<75?"var(--mid)":"var(--hi)";

function buildSectors(){
  $("#sectors").innerHTML=SECTORS.map(s=>`<button type="button" class="pick" data-s="${s.id}" aria-pressed="${s.id===sector}"><span class="tick">✓</span>${icon(s.id)}<span>${s[lang]}</span></button>`).join("");
}
function buildQuestions(){
  const t=T[lang];
  $("#questions").innerHTML=D.map((d,i)=>`<div class="area"><div class="area-head">${icon("a"+i)}<h3>${d[lang]}</h3><span class="badge" id="ds${i}"></span></div>`+
    d.q.map((q,j)=>{const k=i*3+j;return `<div class="q"><p id="ql${k}">${q[L()]}</p><div class="seg" role="group" aria-labelledby="ql${k}">`+
      t.opts.map((o,v)=>`<button type="button" data-k="${k}" data-v="${v}" aria-pressed="${answers[k]===v}">${o}</button>`).join("")+`</div></div>`}).join("")+`</div>`).join("");
}
function render(){
  const t=T[lang];
  document.documentElement.lang=lang; document.documentElement.dir=lang==="ar"?"rtl":"ltr";
  document.querySelectorAll("[data-t]").forEach(el=>el.textContent=t[el.dataset.t]);
  $("#langBtn").textContent=t.lang;
  $("#example").hidden=!isSample;
  buildSectors(); buildQuestions(); update();
}
function update(){
  const t=T[lang];
  document.querySelectorAll(".seg button").forEach(b=>b.setAttribute("aria-pressed",answers[+b.dataset.k]===+b.dataset.v));
  document.querySelectorAll("[data-s]").forEach(b=>b.setAttribute("aria-pressed",b.dataset.s===sector));
  const n=answers.filter(v=>v!=null).length;
  $("#prog").style.width=(n/18*100)+"%";
  $("#counter").textContent=`${n} / 18 ${t.of}`;
  const pcts=D.map((_,i)=>dimPct(i)), valid=pcts.filter(p=>p!=null);
  const total=valid.length?Math.round(valid.reduce((a,b)=>a+b,0)/valid.length):0;
  $("#ringNum").textContent=n?total:"–";
  $("#ringArc").setAttribute("stroke-dashoffset",289-289*total/100);
  const lv=total<26?0:total<51?1:total<76?2:3;
  $("#level").textContent=n?t.levels[lv][0]:"—";
  $("#levelSub").textContent=n?t.levels[lv][1]:t.startMsg;
  pcts.forEach((p,i)=>{const b=$("#ds"+i); b.textContent=p==null?"–":p; b.style.color=color(p)});
  $("#bars").innerHTML=D.map((d,i)=>`<div><div class="bar-label"><span>${d[lang]}</span><span>${pcts[i]==null?"–":pcts[i]}</span></div><div class="track"><div class="fill" style="width:${pcts[i]||0}%;background:${color(pcts[i])}"></div></div></div>`).join("");
  const order=D.map((d,i)=>({d,p:pcts[i]})).filter(x=>x.p!=null&&x.p<75).sort((a,b)=>a.p-b.p).slice(0,3);
  $("#recs").innerHTML=order.length?order.map(x=>`<li><b>${x.d[lang]} · ${x.p}</b>${(x.p<50?x.d.low:x.d.mid)[L()]}</li>`).join(""):`<li>${n?t.allGood:t.startMsg}</li>`;
  const s=SECTORS.find(x=>x.id===sector);
  $("#tip").innerHTML=`<b>${t.tipHead} ${s[lang]}</b>${s.tip[L()]}`;
}
document.addEventListener("click",e=>{
  const b=e.target.closest("button"); if(!b) return;
  if(b.dataset.s){sector=b.dataset.s;update();return}
  if(b.dataset.k!=null){
    if(isSample){isSample=false;answers=Array(18).fill(null);$("#example").hidden=true;}
    const k=+b.dataset.k,v=+b.dataset.v; answers[k]=answers[k]===v?null:v; update();}
});
$("#resetBtn").addEventListener("click",()=>{isSample=false;answers=Array(18).fill(null);render();});
$("#langBtn").addEventListener("click",()=>{lang=lang==="en"?"ar":"en";try{localStorage.setItem("air-lang",lang)}catch(e){};render();});
$("#copyBtn").addEventListener("click",()=>{
  const t=T[lang], pcts=D.map((_,i)=>dimPct(i)), s=SECTORS.find(x=>x.id===sector);
  const txt=`${t.title}\n${s[lang]}\n${$("#ringNum").textContent}/100 · ${$("#level").textContent}\n\n`+D.map((d,i)=>`${d[lang]}: ${pcts[i]??"–"}`).join("\n")+`\n\n${t.priorities}:\n`+[...document.querySelectorAll("#recs li")].map(li=>"• "+li.innerText.replace(/\n/," — ")).join("\n")+`\n\n${s.tip[L()]}\n\ntarekhalteh.com`;
  const btn=$("#copyBtn");
  navigator.clipboard.writeText(txt).then(()=>{btn.textContent=t.copied;setTimeout(()=>btn.textContent=t.copy,1500)}).catch(()=>{
    const ta=document.createElement("textarea");ta.value=txt;btn.after(ta);ta.select();});
});
render();
</script>
</body>
</html>
